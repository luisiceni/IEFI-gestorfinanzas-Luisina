<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanzasGD - IEFI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;800&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"> <!--trae las tipografias-->

    <link rel="stylesheet" href="./src/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!--iconos Font Awesome-->
</head>

<body class="bg-stone-50 text-stone-800 font-sans min-h-screen">

    <!--header-->
    <header class="bg-emerald-900 text-white sticky top-0 z-10">
        <div class="container mx-auto px-4 py-5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="fa-solid fa-wallet text-2xl"></span>
                <h1 class="font-display text-2xl font-semibold">FinanzasGD</h1>
            </div>
            <span class="text-xs bg-emerald-800 px-3 py-1.5 rounded font-medium">ISSRC Hackaton 2026</span>
        </div>
    </header>

    <!--resumen balances-->
    <main class="container mx-auto px-4 py-8 max-w-6xl space-y-7">

        <section aria-label="Resumen de balance">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white rounded-lg border border-stone-200 p-5 flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-stone-600">Ingresos Totales</p>
                        <h3 id="ingresos-totales"
                            class="font-display lining-nums text-2xl font-semibold text-emerald-900 mt-2">$0.00</h3>
                    </div>
                    <div class="w-10 h-10 bg-emerald-50 rounded-lg flex items-center justify-center text-emerald-800">
                        <i class="fa-solid fa-arrow-up text-xl"></i>
                    </div>
                </div>

                <div class="bg-white rounded-lg border border-stone-200 p-5 flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-stone-600">Gastos Totales</p>
                        <h3 id="gastos-totales"
                            class="font-display lining-nums text-2xl font-semibold text-red-700 mt-2">
                            $0.00</h3>
                    </div>
                    <div class="w-10 h-10 bg-rose-50 rounded-lg flex items-center justify-center text-red-700">
                        <span class="fa-solid fa-arrow-down text-xl"></span>
                    </div>
                </div>

                <div class="bg-emerald-900 rounded-lg p-5 flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-emerald-100">Balance Neto</p>
                        <h3 id="balance-neto" class="font-display lining-nums text-2xl font-semibold text-white mt-2">
                            $0.00
                        </h3>
                    </div>
                    <div class="w-10 h-10 bg-emerald-800 rounded-lg flex items-center justify-center text-white">
                        <span class="fa-solid fa-scale-balanced text-xl"></span>
                    </div>
                </div>
            </div>
        </section>

        <!--formulario de ingreso-->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <section class="lg:col-span-1 bg-white rounded-lg border border-stone-200 p-5 self-start">
                <h2 class="text-lg font-semibold text-stone-800 mb-4 flex items-center gap-2">
                    <span class="fa-solid fa-plus-circle text-emerald-800"></span> Registrar Movimiento
                </h2>

                <form id="form-transaccion" class="space-y-4">

                    <div>
                        <label for="descripcion"
                            class="block text-sm font-medium text-stone-700 mb-1.5">Descripción</label>
                        <input type="text" id="descripcion" name="descripcion" required
                            placeholder="Ej: Sueldo, Supermercado..."
                            class="w-full px-3 py-2.5 border border-stone-300 rounded-md bg-white focus:outline-none focus:ring-1 focus:ring-emerald-700 focus:border-emerald-700">
                    </div>

                    <div>
                        <label for="monto" class="block text-sm font-medium text-stone-700 mb-1.5">Monto ($)</label>
                        <input type="number" id="monto" name="monto" min="0.01" step="0.01" required placeholder="0.00"
                            class="w-full px-3 py-2.5 border border-stone-300 rounded-md bg-white focus:outline-none focus:ring-1 focus:ring-emerald-700 focus:border-emerald-700">
                    </div>

                    <div>
                        <label for="tipo" class="block text-sm font-medium text-stone-700 mb-1.5">Tipo de
                            Movimiento</label>
                        <select id="tipo" name="tipo" required
                            class="w-full px-3 py-2.5 border border-stone-300 rounded-md bg-white hover:border-emerald-700 focus:outline-none focus:ring-1 focus:ring-emerald-700 focus:border-emerald-700">
                            <option value="" disabled selected>Seleccione un tipo</option>
                            <option value="ingreso">Ingreso (+)</option>
                            <option value="gasto">Gasto (-)</option>
                        </select>
                    </div>

                    <div>
                        <label for="categoria" class="block text-sm font-medium text-stone-700 mb-1.5">Categoría</label>
                        <select id="categoria" name="categoria" required
                            class="w-full px-3 py-2.5 border border-stone-300 rounded-md bg-white hover:border-emerald-700 focus:outline-none focus:ring-1 focus:ring-emerald-700 focus:border-emerald-700">
                            <option value="" disabled selected>Seleccione una categoría</option>
                            <option value="Sueldo">Sueldo</option>
                            <option value="Comida">Comida</option>
                            <option value="Transporte">Transporte</option>
                            <option value="Servicios">Servicios</option>
                            <option value="Entretenimiento">Entretenimiento</option>
                            <option value="Otros">Otros</option>
                        </select>
                    </div>

                    <div>
                        <label for="fecha" class="block text-sm font-medium text-stone-700 mb-1.5">Fecha</label>
                        <input type="date" id="fecha" name="fecha" required
                            class="w-full px-3 py-2.5 border border-stone-300 rounded-md bg-white focus:outline-none focus:ring-1 focus:ring-emerald-700 focus:border-emerald-700">
                    </div>

                    <button type="submit"
                        class="w-full bg-emerald-900 hover:bg-emerald-800 text-white font-medium py-2.5 px-4 rounded-md flex items-center justify-center gap-2 mt-3">
                        <span class="fa-solid fa-save"></span> Guardar Movimiento
                    </button>
                </form>
            </section>

            <!--historial y resumen -->
            <div class="lg:col-span-2 space-y-5">
                <section class="bg-white rounded-lg border border-stone-200 p-5">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-semibold text-stone-800 flex items-center gap-2">
                            <span class="fa-solid fa-list-check text-emerald-800"></span> Historial de Movimientos
                        </h2>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr
                                    class="bg-stone-50 border-b border-stone-200 text-xs text-stone-500 uppercase tracking-wide">
                                    <th class="py-3 px-4 font-medium text-center">Fecha</th>
                                    <th class="py-3 px-4 font-medium">Descripción</th>
                                    <th class="py-3 px-4 font-medium">Categoría</th>
                                    <th class="py-3 px-4 font-medium">Tipo</th>
                                    <th class="py-3 px-4 font-medium text-right">Monto</th>
                                    <th class="py-3 px-4 font-medium text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="lista-transacciones" class="divide-y divide-stone-100 text-sm">
                            </tbody>
                        </table>
                    </div>
                </section>

                <!--grafico categorias-->
                <section class="bg-white rounded-lg border border-stone-200 p-5">
                    <h2 class="text-lg font-semibold text-stone-800 mb-4 flex items-center gap-2">
                        <span class="fa-solid fa-chart-column text-emerald-800"></span> Resumen por Categorías
                    </h2>
                    <p id="categorias-vacio" class="text-sm text-stone-500" hidden>Todavía no hay movimientos.
                    </p>
                    <div id="contenedor-categorias" style="position: relative; height: 283px;">
                        <canvas id="grafico-categorias"></canvas>
                    </div>
                </section>
            </div>
        </div>

        <!--grafico de lineas-->
        <section class="bg-white rounded-lg border border-stone-200 p-5">
            <h2 class="text-lg font-semibold text-stone-800 mb-4 flex items-center gap-2">
                <span class="fa-solid fa-chart-line text-emerald-800"></span> Evolución Temporal
            </h2>
            <p id="evolucion-vacio" class="text-sm text-stone-500" hidden>Todavía no hay movimientos.</p>
            <div id="contenedor-evolucion" style="position: relative; height: 340px;">
                <canvas id="grafico-evolucion"></canvas>
            </div>
        </section>

    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <!--libreria chart.js-->
    <script type="module" src="index.js"></script>
</body>

</html>
